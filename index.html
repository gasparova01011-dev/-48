<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дорога ополчения — игра ко Дню народного единства</title>
<style>
:root{--ink:#2a1f3d;--gold:#f2b134;--bg:#fff3d6;--card:#fff;--text:#2a1f3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1830;--card:#2b2747;--text:#fff3d6}}
:root[data-theme="dark"]{--bg:#1b1830;--card:#2b2747;--text:#fff3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:19px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:880px;margin:0 auto;padding:12px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 var(--ink)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:.3em 0}
h1{font-size:2em;color:#c8352f}
.hero{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:12px;margin-bottom:8px}
.duo{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
svg text{fill:currentColor;font-family:inherit}
#road{width:100%;height:auto;display:block;color:var(--text)}
#rl{text-align:center;font-weight:700}
.btn{font:inherit;font-weight:800;min-height:54px;padding:10px 22px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);color:#2a1f3d;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #1d6fe0;outline-offset:2px}
.card,.opt{font:inherit;display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:58px;margin:8px 0;padding:10px 14px;background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opts .opt{margin:4px 0;font-weight:700}
.bd{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#2a1f3d;display:grid;place-items:center;font-weight:800;border:2px solid #2a1f3d}
.ok{background:#d6f3dc!important;color:#14301c!important}
.ok .bd{background:#3f8f5a;color:#fff}
.bad{background:#ffd9d6!important;color:#4a1210!important;cursor:default}
.bad .bd{background:#c8352f;color:#fff}
.opt:disabled{cursor:default}
#msg{min-height:3.2em;font-weight:700}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.q{font-size:1.1em;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card:hover,.opt:hover:not(:disabled),.tile:hover:not(:disabled){transform:translateY(-2px)}
h2{border-bottom:4px solid var(--gold);padding-bottom:4px}
.hero{box-shadow:0 5px 0 var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.sel{outline:4px solid #1d6fe0;outline-offset:2px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{font:inherit;font-size:1.5em;font-weight:800;min-width:56px;min-height:60px;border-radius:12px;border:3px solid var(--ink);background:var(--gold);color:#2a1f3d;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tile:disabled{cursor:default}
#wd{font-size:2em;font-weight:800;letter-spacing:.1em;min-height:1.6em}
.cert{border:8px double #c8352f;outline:3px solid #f2b134;outline-offset:-14px;background:#fffaf0;color:#2a1f3d;padding:24px 18px;margin:14px 0;border-radius:10px;text-align:center}
.ct{font:800 2.2em Georgia,serif;letter-spacing:.12em;color:#c8352f}
.nm{font:700 1.7em Georgia,serif;border-bottom:2px solid #2a1f3d;display:inline-block;min-width:60%;margin:6px 0}
.rs{margin:8px auto;border-collapse:collapse;text-align:left;font-size:.9em}
.rs td{padding:3px 12px;border-bottom:1px dotted #8a7a6a}
.dt{font-size:.9em}
#nm{font:inherit;color:#2a1f3d;background:#fff;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;max-width:100%}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;box-sizing:border-box}}
</style>
</head>

  <div class="panel">

      <path d="M40 72C140 20 240 100 340 58S520 30 560 66" fill="none" stroke="#e8c898" stroke-width="12" stroke-linecap="round"/>
      <path d="M40 72C140 20 240 100 340 58S520 30 560 66" fill="none" stroke="#fff6e0" stroke-width="2" stroke-dasharray="6 8"/><use href="#tree" transform="translate(100 98)"/><use href="#tree" transform="translate(205 98)"/><use href="#tree" transform="translate(285 30)"/><use href="#tree" transform="translate(405 96)"/><use href="#tree" transform="translate(470 26)"/><use href="#tree" transform="translate(525 98)"/>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var stage=$('#stage'),road=$('#roadpath'),mk=$('#mk'),TOTAL=25,ROUNDS=7;
var done=0,mistakes=0,mkPos=0,rnd=0,lastM=0,roundErr=[];
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var HERO='<svg class="hero" viewBox="0 0 600 220" role="img" aria-label="Кремль с башней-звездой и храмами"><use href="#scene"/></svg>';
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function T(n){return 'Задание '+rnd+' из '+ROUNDS+'. '+n}
function shake(b){b.classList.add('shake');setTimeout(function(){b.classList.remove('shake')},450)}
function setProg(n){
  var L=road.getTotalLength(),from=mkPos,to=n/TOTAL,t0=performance.now(),d=reduce?0:500;
  $('#rl').textContent='Путь ополчения: '+n+' из '+TOTAL;
  (function f(t){
    var k=d?Math.min(1,(t-t0)/d):1,p=from+(to-from)*k,pt=road.getPointAtLength(L*p);
    mk.setAttribute('transform','translate('+pt.x+' '+pt.y+')');
    if(k<1)requestAnimationFrame(f);else mkPos=to;
  })(t0);
}
function nextBtn(label,fn){var b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;$('#nx').appendChild(b);b.focus()}
function nextRound(){if(rnd>0){roundErr[rnd-1]=mistakes-lastM;lastM=mistakes}if(rnd<ROUNDS){rnd++;rounds[rnd-1]()}else finish()}
function start(){
  done=0;mistakes=0;mkPos=0;rnd=0;lastM=0;roundErr=[];setProg(0);
  stage.innerHTML=HERO+'<h1>Дорога ополчения</h1><p>Осень 1612 года. Страна переживает Смутное время, и жители русских городов решают освободить Москву. Помоги ополчению дойти до столицы: выполни 7 заданий, и флаг дойдёт до Кремля!</p><p>Каждый раз вопросы подбираются заново, поэтому играть интересно снова и снова.</p><button class="btn" id="go">Начать поход</button>';
  $('#go').onclick=nextRound;
}

var EV=['В стране смута: нет царя, а в Москве хозяйничают польско-литовские отряды.',
'Патриарх Гермоген призывает русских людей встать на защиту Родины.',
'В Нижнем Новгороде староста Кузьма Минин призывает собрать ополчение.',
'Нижегородцы собирают деньги и оружие. Войско возглавляет князь Дмитрий Пожарский.',
'Ополчение идёт к Москве и останавливается в Ярославле, где собирает новые силы.',
'Осенью 1612 года ополченцы освобождают Москву.',
'В 1613 году Земский собор избирает царя Михаила Романова.'];
function r1(){
  var ord=pick([0,1,2,3,4,5,6],5).sort(function(a,b){return a-b}),next=0;
  stage.innerHTML='<h2>'+T('Что за чем?')+'</h2><p>Нажимай на события по порядку: от самого раннего к самому позднему.</p><div id="list"></div><p id="msg" role="status"></p><div id="nx"></div>';
  shuffle(ord).forEach(function(e){
    var b=document.createElement('button');b.className='card';
    b.innerHTML='<span class="bd">?</span><span>'+EV[e]+'</span>';
    b.onclick=function(){
      if(b.disabled)return;
      if(e===ord.slice().sort(function(a,c){return a-c})[next]){
        b.disabled=true;b.classList.add('ok');b.querySelector('.bd').textContent=(next+1)+'✓';
        next++;done++;setProg(done);
        if(next===5){$('#msg').textContent='Верно! Ты правильно выстроил цепочку событий.';nextBtn('Дальше',nextRound)}
        else $('#msg').textContent='Верно! Что было следом?';
      }else{mistakes++;shake(b);$('#msg').textContent='Это случилось позже. Что произошло раньше?'}
    };
    $('#list').appendChild(b);
  });
}

function quiz(title,intro,fig,qs,shuf,after){
  var k=0;
  function show(){
    var q=qs[k],idx=q.o.map(function(_,i){return i});if(shuf)idx=shuffle(idx);
    stage.innerHTML='<h2>'+title+'</h2>'+(k===0?'<p>'+intro+'</p>':'')+fig+'<p>Вопрос '+(k+1)+' из '+qs.length+'</p><p class="q">'+q.q+'</p><div class="opts" id="opts"></div><p id="msg" role="status"></p><div id="nx"></div>';
    idx.forEach(function(i){
      var b=document.createElement('button');b.className='opt';
      b.innerHTML='<span class="bd">•</span><span>'+q.o[i]+'</span>';
      b.onclick=function(){
        if(i===q.a){
          b.classList.add('ok');b.querySelector('.bd').textContent='✓';
          document.querySelectorAll('#opts .opt').forEach(function(x){x.disabled=true});
          done++;setProg(done);$('#msg').textContent='Верно! '+q.e;
          nextBtn('Дальше',function(){k++;if(k<qs.length)show();else after()});
        }else{mistakes++;b.disabled=true;b.classList.add('bad');b.querySelector('.bd').textContent='✗';$('#msg').textContent='Пока не то. Подсказка: '+q.h}
      };
      $('#opts').appendChild(b);
    });
  }
  show();
}

var WHO=[
['Был земским старостой в Нижнем Новгороде и первым призвал собирать ополчение.',0,'Староста — человек, которого выбирают горожане.','Это Кузьма Минин.'],
['Князь и опытный воевода, который командовал войском ополчения.',1,'Воеводой стал князь, а не староста.','Войско возглавил князь Дмитрий Пожарский.'],
['Вместе вели народное ополчение к Москве.',2,'В этом вопросе подходят сразу два имени.','Минин и Пожарский действовали вместе.'],
['Собирал деньги и помощь для войска у горожан.',0,'Это забота старосты, который призвал к сбору.','Сбором средств занимался Кузьма Минин.'],
['Был ранен в боях за Москву в 1611 году, а позже возглавил поход.',1,'Ранение получил военный командир.','Это князь Дмитрий Пожарский.'],

['Им поставлен памятник на Красной площади.',2,'Памятник стоит двум героям сразу.','Памятник поставлен им обоим.'],

function r2(){

['Москву освободили от захватчиков в 1812 году.',false,'В 1812 году была война с Наполеоном, а Москву освободили в 1612 году.'],

function r3(){

var PAIRS=[['Ополчение','народное войско из добровольцев'],['Воевода','военный начальник'],['Староста','выборный представитель горожан'],['Смута','время бед и безвластия в государстве'],['Единство','когда люди вместе ради общего дела'],['Кремль','древняя крепость в центре Москвы'],['Памятник','скульптура в честь героев'],['Захватчики','враги, пришедшие на чужую землю']];
function r4(){
  var P=pick(PAIRS,4),sel=null,got=0;
  stage.innerHTML='<h2>'+T('Слова и значения')+'</h2><p>Нажми на слово слева, а затем на его значение справа.</p><div class="cols"><div id="L"></div><div id="R"></div></div><p id="msg" role="status"></p><div id="nx"></div>';
  function mkb(txt,i,left){
    var b=document.createElement('button');b.className='card';b.innerHTML='<span class="bd">•</span><span>'+txt+'</span>';
    b.onclick=function(){
      if(b.disabled)return;
      if(left){
        if(sel){sel.b.classList.remove('sel');sel.b.querySelector('.bd').textContent='•'}
        sel={b:b,i:i};b.classList.add('sel');b.querySelector('.bd').textContent='▶';
      }else if(!sel){$('#msg').textContent='Сначала выбери слово слева.'}
      else if(sel.i===i){
        [sel.b,b].forEach(function(x){x.disabled=true;x.classList.remove('sel');x.classList.add('ok');x.querySelector('.bd').textContent='✓'});
        sel=null;got++;done++;setProg(done);$('#msg').textContent='Верно!';
        if(got===4){$('#msg').textContent='Верно! Все пары найдены.';nextBtn('Дальше',nextRound)}
      }else{mistakes++;shake(b);sel.b.classList.remove('sel');sel.b.querySelector('.bd').textContent='•';sel=null;$('#msg').textContent='Не совпало. Подумай о значении слова и попробуй ещё раз.'}
    };
    $(left?'#L':'#R').appendChild(b);
  }
  P.forEach(function(p,i){mkb(p[0],i,true)});
  shuffle(P.map(function(p,i){return i})).forEach(function(i){mkb(P[i][1],i,false)});
}

var W=[['ЕДИНСТВО','Когда люди вместе ради общего дела'],['ОПОЛЧЕНИЕ','Народное войско из добровольцев'],['КРЕМЛЬ','Древняя крепость в центре Москвы'],['ПАМЯТНИК','Скульптура в честь героев'],['ВОЕВОДА','Военный начальник, например князь Пожарский'],['ПОХОД','Дальний путь войска к цели']];
function r6(){
  var ws=pick(W,2),k=0;
  function show(){
    var w=ws[k][0],g='';
    stage.innerHTML='<h2>'+T('Собери слово')+'</h2><p>Нажимай на буквы по порядку и собери слово.</p><p class="q">Подсказка: '+ws[k][1]+'</p><div id="wd" aria-live="polite"></div><div class="tiles" id="tl"></div><p id="msg" role="status"></p><div id="nx"></div>';
    function draw(){var s=g;for(var i=g.length;i<w.length;i++)s+='_';$('#wd').textContent=s.split('').join(' ')}
    draw();
    shuffle(w.split('')).forEach(function(c){
      var b=document.createElement('button');b.className='tile';b.textContent=c;
      b.onclick=function(){
        if(b.disabled)return;
        if(c===w.charAt(g.length)){
          g+=c;b.disabled=true;b.classList.add('ok');draw();
          if(g.length===w.length){done++;setProg(done);$('#msg').textContent='Верно! Получилось слово «'+w+'».';nextBtn('Дальше',function(){k++;if(k<ws.length)show();else nextRound()})}
        }else{mistakes++;shake(b);$('#msg').textContent='Эта буква здесь не подходит. Попробуй другую.'}
      };
      $('#tl').appendChild(b);
    });
  }
  show();
}

function mq(text,c,h,e){
  var ds=shuffle([c+10,c-10,c+100,c-100,c+1,c-1,c+5]).filter(function(x){return x>0&&x!==c}).slice(0,2);
  return{q:text,o:[String(c),String(ds[0]),String(ds[1])],a:0,h:h,e:e+' Ответ: '+c+'.'};
}
function r7(){
  var y=new Date().getFullYear(),c=y-1612,a=ri(4,9),b=[20,30,40,50][ri(0,3)],d=ri(3,7),km=[15,20,25,30][ri(0,3)],x=ri(12,40)*100,z=ri(5,20)*100;
  var gens=[

    function(){return mq('Ополчение проходило по '+km+' км в день. Сколько километров оно прошло за '+d+' дней?',km*d,'Одинаковый путь каждый день — умножай.',km+' × '+d+'.')},
    function(){return mq('Нижегородцы собрали '+x+' рублей, а потом ещё '+z+' рублей. Сколько рублей собрали всего?',x+z,'«Всего» значит сложить.',x+' + '+z+'.')}];
  quiz(T('Задачи ополчения'),'Реши задачи. Подсказка появится, если ошибёшься.','',[mq('Ополчение освободило Москву в 1612 году. Сколько лет прошло с тех пор до '+y+' года?',c,'Из текущего года вычти 1612.',y+' − 1612.'),gens[ri(0,2)]()],true,nextRound);
}
var rounds=[r1,r2,r3,r4,r5,r6,r7];

  var s=mistakes<=5?3:mistakes<=12?2:1;
  var title=['','Ополченец','Воевода','Герой единства!'][s],stars='';

  '<div class="cert" id="cert"><div class="ct">ГРАМОТА</div><svg viewBox="0 0 240 70" width="240" role="img" aria-label="Кремлёвская башня и храмы"><use href="#ch" fill="#c8352f" transform="translate(52 36) scale(.55)"/><use href="#ch" fill="#2b6cc4" transform="translate(188 36) scale(.55)"/><use href="#tw" transform="translate(120 68) scale(.34)"/></svg>'+
  '<p>за участие в походе народного ополчения и знание истории Дня народного единства награждается</p><div class="nm" id="who">ученик 4 класса</div><p>Звание: <b>'+title+'</b></p>'+
  '<svg viewBox="0 0 150 52" width="170" role="img" aria-label="Звёзд: '+s+' из 3">'+stars+'</svg><table class="rs">'+rows+'</table>'+
  '<p>Заданий выполнено: '+ROUNDS+' из '+ROUNDS+'. Всего ошибок: '+mistakes+'. Звёзд: '+s+' из 3.</p><p class="dt">'+new Date().toLocaleDateString('ru-RU')+'</p></div>'+

  $('#again').onclick=start;
